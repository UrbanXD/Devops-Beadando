name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: Run backend tests
        run: python -m pytest backend/tests

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Save frontend build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-dist-${{ github.sha }}-${{ github.run_attempt }}
          path: frontend/dist
          if-no-files-found: error
          retention-days: 14

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    outputs:
      filesystem_scan_outcome: ${{ steps.filesystem_scan.outcome }}
      history_scan_outcome: ${{ steps.history_scan.outcome }}
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Scan repository for secrets
        id: filesystem_scan
        continue-on-error: true
        run: bash scripts/scan-worktree-secrets.sh

      - name: Scan Git history for secrets
        id: history_scan
        continue-on-error: true
        run: bash scripts/scan-git-history-secrets.sh

      - name: Save secret scan reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: secret-scan-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            reports/filesystem-secret-scan.json
            reports/git-history-secret-scan.json
            reports/git-history-secret-findings.json
          if-no-files-found: ignore
          retention-days: 14

  python-dependency-audit:
    name: Python dependency audit
    runs-on: ubuntu-latest
    outputs:
      audit_outcome: ${{ steps.pip_audit.outcome }}
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install Python audit tools
        run: python -m pip install -r backend/requirements-dev.txt

      - name: Audit Python dependencies
        id: pip_audit
        continue-on-error: true
        run: bash scripts/audit-python-dependencies.sh

      - name: Save audit report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-audit-${{ github.sha }}-${{ github.run_attempt }}
          path: reports/pip-audit.json
          if-no-files-found: ignore
          retention-days: 14

  frontend-dependency-audit:
    name: Frontend dependency audit
    runs-on: ubuntu-latest
    outputs:
      audit_outcome: ${{ steps.npm_audit.outcome }}
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Audit frontend dependencies
        id: npm_audit
        continue-on-error: true
        run: bash scripts/audit-frontend-dependencies.sh

      - name: Save audit report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-audit-${{ github.sha }}-${{ github.run_attempt }}
          path: reports/npm-audit.json
          if-no-files-found: ignore
          retention-days: 14

  container-build:
    name: Build container images
    runs-on: ubuntu-latest
    needs:
      - backend-tests
      - frontend-build
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build and save container images
        env:
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          REPOSITORY: ${{ github.repository }}
        run: bash scripts/build-container-artifact.sh container-artifact

      - name: Save images for scanning
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: container-images-${{ github.sha }}-${{ github.run_attempt }}
          path: container-artifact/
          if-no-files-found: error
          retention-days: 3

  container-security:
    name: Container scan and SBOM
    runs-on: ubuntu-latest
    needs: container-build
    permissions:
      contents: read
    outputs:
      scan_outcome: ${{ steps.container_scan.outcome }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download images for scanning
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: container-images-${{ github.sha }}-${{ github.run_attempt }}
          path: container-artifact

      - name: Verify, scan images and generate SBOMs
        id: container_scan
        continue-on-error: true
        env:
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          REPOSITORY: ${{ github.repository }}
        run: bash scripts/scan-container-images.sh container-artifact reports

      - name: Save container scan reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: container-scan-reports-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            reports/backend-image-scan.json
            reports/frontend-image-scan.json
            reports/container-scan-metadata.json
            reports/container-image-manifest.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Save image SBOMs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-sboms-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            reports/backend-sbom.spdx.json
            reports/frontend-sbom.spdx.json
            reports/container-image-manifest.json
            reports/container-scan-metadata.json
          if-no-files-found: ignore
          retention-days: 30

  sbom-signing:
    name: Sign SBOMs
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    needs: container-security
    permissions:
      contents: read
      id-token: write
    outputs:
      signing_outcome: ${{ steps.sbom_signing.outcome }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download image SBOMs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-sboms-${{ github.sha }}-${{ github.run_attempt }}
          path: reports

      - name: Install Cosign
        id: cosign_setup
        continue-on-error: true
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.4

      - name: Sign SBOMs with GitHub OIDC
        id: sbom_signing
        if: always()
        continue-on-error: true
        run: bash scripts/sign-sboms.sh reports

      - name: Save SBOM signatures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-sbom-signatures-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            reports/backend-sbom.spdx.json.sigstore.json
            reports/frontend-sbom.spdx.json.sigstore.json
          if-no-files-found: ignore
          retention-days: 30

  security-gate:
    name: Security gate
    runs-on: ubuntu-latest
    if: always()
    needs:
      - secret-scan
      - python-dependency-audit
      - frontend-dependency-audit
      - container-security
      - sbom-signing
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download secret scan reports
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: secret-scan-${{ github.sha }}-${{ github.run_attempt }}
          path: gate-inputs/secret-scan

      - name: Download Python audit report
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-audit-${{ github.sha }}-${{ github.run_attempt }}
          path: gate-inputs/python-audit

      - name: Download frontend audit report
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontend-audit-${{ github.sha }}-${{ github.run_attempt }}
          path: gate-inputs/frontend-audit

      - name: Download container scan reports
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: container-scan-reports-${{ github.sha }}-${{ github.run_attempt }}
          path: gate-inputs/container-scan

      - name: Download image SBOMs and signatures
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-sboms-${{ github.sha }}-${{ github.run_attempt }}
          path: gate-inputs/image-sboms

      - name: Download SBOM signatures
        if: github.event_name == 'push'
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-sbom-signatures-${{ github.sha }}-${{ github.run_attempt }}
          path: gate-inputs/image-sboms

      - name: Install Cosign for signature verification
        id: cosign_verification_setup
        if: github.event_name == 'push'
        continue-on-error: true
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.4

      - name: Evaluate security policy
        env:
          SOURCE_SHA: ${{ github.sha }}
          FILESYSTEM_SCAN_OUTCOME: ${{ needs.secret-scan.outputs.filesystem_scan_outcome }}
          HISTORY_SCAN_OUTCOME: ${{ needs.secret-scan.outputs.history_scan_outcome }}
          PYTHON_AUDIT_OUTCOME: ${{ needs.python-dependency-audit.outputs.audit_outcome }}
          FRONTEND_AUDIT_OUTCOME: ${{ needs.frontend-dependency-audit.outputs.audit_outcome }}
          CONTAINER_SCAN_OUTCOME: ${{ needs.container-security.outputs.scan_outcome }}
          SBOM_SIGNING_OUTCOME: ${{ needs.sbom-signing.outputs.signing_outcome }}
          SECRET_JOB_RESULT: ${{ needs.secret-scan.result }}
          PYTHON_AUDIT_JOB_RESULT: ${{ needs.python-dependency-audit.result }}
          FRONTEND_AUDIT_JOB_RESULT: ${{ needs.frontend-dependency-audit.result }}
          CONTAINER_SECURITY_JOB_RESULT: ${{ needs.container-security.result }}
          SBOM_SIGNING_JOB_RESULT: ${{ needs.sbom-signing.result }}
        run: bash scripts/security-gate.sh gate-inputs reports

      - name: Save security gate report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-gate-${{ github.sha }}-${{ github.run_attempt }}
          path: reports/security-gate.json
          if-no-files-found: ignore
          retention-days: 14
