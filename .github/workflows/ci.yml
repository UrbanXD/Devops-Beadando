name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: Run backend tests
        run: python -m pytest backend/tests

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Save frontend build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-dist-${{ github.sha }}-${{ github.run_attempt }}
          path: frontend/dist
          if-no-files-found: error
          retention-days: 14

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Scan repository for secrets
        id: filesystem_scan
        continue-on-error: true
        run: bash scripts/scan-worktree-secrets.sh

      - name: Scan Git history for secrets
        id: history_scan
        continue-on-error: true
        run: bash scripts/scan-git-history-secrets.sh

      - name: Save secret scan reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: secret-scan-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            reports/filesystem-secret-scan.json
            reports/git-history-secret-scan.json
            reports/git-history-secret-findings.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Fail if either secret scan failed
        if: always()
        env:
          FILESYSTEM_SCAN_OUTCOME: ${{ steps.filesystem_scan.outcome }}
          HISTORY_SCAN_OUTCOME: ${{ steps.history_scan.outcome }}
        run: |
          if [ "$FILESYSTEM_SCAN_OUTCOME" != "success" ] || \
             [ "$HISTORY_SCAN_OUTCOME" != "success" ]; then
            echo "A secret scan found a result or did not complete."
            exit 1
          fi

  python-dependency-audit:
    name: Python dependency audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install Python audit tools
        run: python -m pip install -r backend/requirements-dev.txt

      - name: Audit Python dependencies
        run: bash scripts/audit-python-dependencies.sh

      - name: Save audit report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-audit-${{ github.sha }}-${{ github.run_attempt }}
          path: reports/pip-audit.json
          if-no-files-found: ignore
          retention-days: 14

  frontend-dependency-audit:
    name: Frontend dependency audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Audit frontend dependencies
        run: bash scripts/audit-frontend-dependencies.sh

      - name: Save audit report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-audit-${{ github.sha }}-${{ github.run_attempt }}
          path: reports/npm-audit.json
          if-no-files-found: ignore
          retention-days: 14

  container-build:
    name: Build container images
    runs-on: ubuntu-latest
    needs:
      - backend-tests
      - frontend-build
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build and save container images
        env:
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          REPOSITORY: ${{ github.repository }}
        run: bash scripts/build-container-artifact.sh container-artifact

      - name: Save images for scanning
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: container-images-${{ github.sha }}-${{ github.run_attempt }}
          path: container-artifact/
          if-no-files-found: error
          retention-days: 3

  container-security:
    name: Container scan and SBOM
    runs-on: ubuntu-latest
    needs: container-build
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download images for scanning
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: container-images-${{ github.sha }}-${{ github.run_attempt }}
          path: container-artifact

      - name: Verify, scan images and generate SBOMs
        id: container_scan
        continue-on-error: true
        env:
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          REPOSITORY: ${{ github.repository }}
        run: bash scripts/scan-container-images.sh container-artifact reports

      - name: Save container scan reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: container-scan-reports-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            reports/backend-image-scan.json
            reports/frontend-image-scan.json
            reports/container-scan-metadata.json
            reports/container-image-manifest.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Save image SBOMs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-sboms-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            reports/backend-sbom.spdx.json
            reports/frontend-sbom.spdx.json
            reports/container-image-manifest.json
            reports/container-scan-metadata.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Fail if either container scan failed
        if: always()
        env:
          CONTAINER_SCAN_OUTCOME: ${{ steps.container_scan.outcome }}
        run: |
          if [ "$CONTAINER_SCAN_OUTCOME" != "success" ]; then
            echo "A container scan found a high or critical vulnerability, or did not complete."
            exit 1
          fi
