apiVersion: v1
kind: Service
metadata:
  name: db-headless
  labels:
    app.kubernetes.io/name: converter
    app.kubernetes.io/component: database
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: converter
    app.kubernetes.io/component: database
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: v1
kind: Service
metadata:
  name: db
  labels:
    app.kubernetes.io/name: converter
    app.kubernetes.io/component: database
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: converter
    app.kubernetes.io/component: database
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: db
  labels:
    app.kubernetes.io/name: converter
    app.kubernetes.io/component: database
    app.kubernetes.io/environment: {{ .Values.environment | quote }}
spec:
  serviceName: db-headless
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: converter
      app.kubernetes.io/component: database
  template:
    metadata:
      labels:
        app.kubernetes.io/name: converter
        app.kubernetes.io/component: database
        app.kubernetes.io/environment: {{ .Values.environment | quote }}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: postgres
          image: {{ .Values.postgres.image | quote }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: converter
            - name: POSTGRES_USER
              value: converter
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: converter-runtime
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          startupProbe:
            exec:
              command: [sh, -c, pg_isready -U converter -d converter]
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            exec:
              command: [sh, -c, pg_isready -U converter -d converter]
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            exec:
              command: [sh, -c, pg_isready -U converter -d converter]
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
        labels:
          app.kubernetes.io/name: converter
          app.kubernetes.io/component: database
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: {{ .Values.postgres.storageSize }}
