services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: converter
      POSTGRES_USER: converter
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U converter -d converter"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  api:
    build:
      context: ./backend
    environment:
      STORAGE_PATH: ${STORAGE_PATH:-/data}
      DATABASE_URL: postgresql+psycopg://converter:${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}@db:5432/converter
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Copy .env.example to .env and set JWT_SECRET_KEY}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - converter-data:/data
      - ./backend:/app
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./frontend
    ports:
      - "${WEB_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    depends_on:
      - api

volumes:
  converter-data:
  frontend-node-modules:
  postgres-data:
