services:
  api:
    build:
      context: ./backend
    environment:
      STORAGE_PATH: ${STORAGE_PATH:-/data}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - converter-data:/data
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  web:
    build:
      context: ./frontend
    ports:
      - "${WEB_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    depends_on:
      - api

volumes:
  converter-data:
  frontend-node-modules:
